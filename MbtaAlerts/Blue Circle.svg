<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100"
  height="100"
  viewBox="0 0 100 100"
  style="background: none;"
>
  <style>
    :root {
      --primary: DarkBlue;
      --text: White;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: LightBlue;
        --text: #1a1a1a;
      }
    }

    circle {
      fill: var(--primary);
    }

    text {
      fill: var(--text);
    }
  </style>

  <circle
    cx="50"
    cy="50"
    r="45"
  />

  <text
    x="50"
    y="52"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Arial, sans-serif"
    font-size="36"
    font-weight="bold"
  >BL</text>
</svg>
