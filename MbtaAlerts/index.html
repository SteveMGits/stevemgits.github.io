<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MBTA Subway Alerts</title>
  <link rel="icon" type="image/svg+xml" href="mbta.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="title">MBTA Subway Alerts</h1>
  <div id="last-updated">Last updated: —</div>
  <div id="alerts"><p class="no-alerts">Loading alerts…</p></div>
  <div id="no-api-key" class="no-alerts"><p>Warning - no API Key set!</p></div>

  <script>

    var apiKey = window.location.search;
    var headers = null;
    
    if(apiKey != null && apiKey != "")
    {
      apiKey = apiKey.substr(1); // trim ? from query param
      headers = { "x-api-key": apiKey }
    }
    else
    {
      document.getElementById("no-api-key").style.display = "block";
    }
    
    const ALERTS_URL = "https://api-v3.mbta.com/alerts?filter[route_type]=1" /* + "&sort=-effective_datetime"*/;

    async function fetchAlerts() {
      try {
        const res = await fetch(ALERTS_URL, {
          headers: headers ?? {}
        });
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const { data } = await res.json();

        renderAlerts(data);
        document.getElementById("last-updated").textContent =
          "Last updated: " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("alerts").innerHTML =
          `<p class="no-alerts">Error fetching alerts:<br>${err.message}</p>`;
      }
    }

    function toTitleCase(str) {
      str = str.replace(/_/g, " ");
      return str.toLowerCase().replace(/\b\w/g, match => match.toUpperCase());
    }

    function renderAlerts(alerts) {
      let myNow = new Date();

      alerts = alerts.filter(a => 
        // Only show unexpected alerts
        a.attributes.lifecycle != "UPCOMING" &&

        // Only show alert less than 1 week old
        myNow - (new Date(a.attributes.created_at)) < 7 * 24 * 60 * 60 * 1000
      );
      
      const container = document.getElementById("alerts");
      
      // Alert data for testing
      /*
      alerts = [
        { 
          attributes: {
            effect: "DELAY", 
            cause: "CONSTRUCTION", 
            short_header: "This is the short header",
            header: "This is the (long) header",
            informed_entity: [{route: "Blue"}]
          }
        },
        { 
          attributes: {
            effect: "DELAY", 
            cause: "CONSTRUCTION", 
            short_header: "This is the short header",
            header: "This is the (long) header",
            informed_entity: [{route: "Red"}]
          }
        },
        { 
          attributes: {
            effect: "DELAY", 
            cause: "CONSTRUCTION", 
            short_header: "This is the short header",
            header: "This is the (long) header",
            informed_entity: [{route: "Green"}]
          }
        },
        { 
          attributes: {
            effect: "DELAY", 
            cause: "CONSTRUCTION", 
            short_header: "This is the short header",
            header: "This is the (long) header",
            informed_entity: [{route: "Orange"}]
          }
        },
      ];
      */

      if (!alerts.length) {
        container.innerHTML = `<p class="no-alerts">No active subway alerts.</p>`;
        return;
      }
      
      container.innerHTML = alerts
        .map(a => {
          // Each alert has attributes: header, description, effect
          const { effect, cause, short_header, header, informed_entity } = a.attributes;
          
          var lineColor = informed_entity[0].route;
          
          return `
            <div class="alert ${lineColor}">
              <span class="icon ${lineColor}">
                <object data="${lineColor} Circle.svg" type="image/svg+xml"></object>
              </span>
              <div class="alertText">
                <h1>${(toTitleCase(effect) || "Unknown")} - <em>${(toTitleCase(cause) || "Unknown")}</em></h1>
                <p>${short_header || header || "No details available"}</p>
              </div>
            </div>`;
        })
        .join("");
    }

    // Initial load
    fetchAlerts();
    // Refresh every 60 seconds
    setInterval(fetchAlerts, 60_000);
  </script>
</body>
</html>
